<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="/lib2/lib2.css" />
    <title>Pony Pinball</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background-image:
          radial-gradient(#222 6px, transparent 6px),
          radial-gradient(#222 6px, #000 6px);
        background-size: 80px 80px;
        background-position:
          0 0,
          40px 40px;
      }
      #game {
        pointer-events: auto;
        overflow: hidden;
      }
      button:active {
        filter: brightness(1.25);
      }
      .mb {
        pointer-events: auto;
        cursor: pointer;
        color: #123;
        background: #fc8;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #fff;
        padding: 0;
        font-size: 28px;
        font-weight: bold;
        touch-action: none;
        opacity: 0.5;
      }
      .mb:active,
      .mb.a {
        opacity: 0.25;
        filter: none;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="fixed">Loading...</div>
    <div id="error" class="fixed" style="display: none">
      Encountered a problem with this content.
    </div>
    <div id="outer-game" class="game-outer-yes-controls">
      <div id="game" style="display: none"></div>
    </div>
    <div id="top-bar" style="display: none">
      <button onclick="onToggleSound(this)">
        <img src="/lib2/assets/sound_on.svg" />
      </button>
      <button onclick="onToggleControls(this)">
        <img src="/lib2/assets/controls.svg" />
      </button>
      <button onclick="onToggleHelp(this)">
        <img src="/lib2/assets/help.svg" />
      </button>
    </div>
    <div id="controls" style="display: none; pointer-events: none"></div>
    <script src="/src/Main.ts" type="module"></script>
  </body>
</html>
